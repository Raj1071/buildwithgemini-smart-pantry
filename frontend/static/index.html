<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Pantry — AI Kitchen Assistant</title>
<!-- Material Symbols for A2UI icons and UI elements -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #0d9488;
    --accent-dark: #0f766e;
    --bg: #f8fafc;
    --border: #e2e8f0;
    --text-primary: #1e293b;
    --text-muted: #64748b;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text-primary); display:flex; flex-direction:column; height:100vh; }
  
  header { background:linear-gradient(135deg, var(--accent-dark) 0%, var(--accent) 100%); color:#fff; padding:0.9rem 1.4rem; display:flex; align-items:center; justify-content:space-between; box-shadow:0 4px 12px rgba(15, 118, 110, 0.15); z-index:10; }
  .header-brand { display:flex; align-items:center; gap:0.75rem; }
  .header-brand .logo { font-size:1.6rem; }
  .header-brand .title-group { display:flex; flex-direction:column; }
  .header-brand .title { font-weight:700; font-size:1.15rem; letter-spacing:-0.01em; line-height:1.2; }
  .header-brand .subtitle { font-size:0.75rem; opacity:0.85; font-weight:400; }
  .status-badge { display:flex; align-items:center; gap:0.4rem; font-size:0.8rem; background:rgba(255,255,255,0.15); backdrop-filter:blur(4px); padding:0.35rem 0.75rem; border-radius:20px; font-weight:500; }
  .status-dot { width:8px; height:8px; background:#4ade80; border-radius:50%; box-shadow:0 0 8px #4ade80; }

  #log { flex:1; overflow-y:auto; padding:1.5rem 1.2rem; max-width:820px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:1.2rem; }
  
  /* Dialogue Layout */
  .msg { display:flex; gap:0.8rem; max-width:85%; align-items:flex-start; animation: fadeIn 0.25s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .msg.user { align-self:flex-end; flex-direction:row-reverse; }
  .msg.agent { align-self:flex-start; }
  
  .avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,0.06); }
  .avatar.user { background:linear-gradient(135deg, var(--accent-dark), var(--accent)); color:#fff; }
  .avatar.agent { background:#ccfbf1; border:1px solid #99f6e4; color:var(--accent-dark); }
  
  .msg-content { display:flex; flex-direction:column; gap:0.25rem; max-width:100%; }
  .msg.user .msg-content { align-items:flex-end; }
  
  .sender-name { font-size:0.75rem; font-weight:600; color:var(--text-muted); padding:0 0.2rem; }
  
  .bubble { padding:0.85rem 1.15rem; border-radius:18px; background:#ffffff; border:1px solid var(--border); text-align:left; color:var(--text-primary); line-height:1.5; font-size:0.95rem; box-shadow:0 2px 8px rgba(0,0,0,0.03); white-space:pre-wrap; word-break:break-word; }
  .msg.user .bubble { background:linear-gradient(135deg, var(--accent-dark), var(--accent)); color:#ffffff; border:none; border-radius:18px 18px 4px 18px; box-shadow:0 4px 12px rgba(13, 148, 136, 0.2); }
  .msg.agent .bubble { border-radius:18px 18px 18px 4px; }
  
  /* Rich A2UI Card container */
  .bubble.rich { background:transparent; border:none; padding:0; box-shadow:none; white-space:normal; width:100%; }

  /* Input Footer */
  .footer-container { background:#ffffff; border-top:1px solid var(--border); box-shadow:0 -4px 20px rgba(0,0,0,0.03); padding:1rem; position:sticky; bottom:0; }
  form { display:flex; flex-direction:column; gap:0.6rem; max-width:820px; width:100%; margin:0 auto; }
  .prompt-chips { display:flex; gap:0.5rem; overflow-x:auto; padding-bottom:0.2rem; scrollbar-width:none; }
  .prompt-chips::-webkit-scrollbar { display:none; }
  .chip { background:#f1f5f9; color:#334155; border:1px solid var(--border); border-radius:20px; padding:0.45rem 0.9rem; font-size:0.825rem; font-weight:500; cursor:pointer; white-space:nowrap; transition:all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
  .chip:hover { background:var(--accent); color:#fff; border-color:var(--accent); transform:translateY(-1px); box-shadow:0 4px 10px rgba(13, 148, 136, 0.15); }
  
  .input-container { display:flex; gap:0.6rem; width:100%; }
  input { flex:1; padding:0.75rem 1rem; border:1px solid var(--border); border-radius:12px; font-size:0.95rem; background:#f8fafc; transition:all 0.2s ease; }
  input:focus { outline:none; background:#ffffff; border-color:var(--accent); box-shadow:0 0 0 3px rgba(13, 148, 136, 0.15); }
  button[type="submit"] { padding:0.75rem 1.3rem; border:none; border-radius:12px; background:linear-gradient(135deg, var(--accent-dark), var(--accent)); color:#fff; font-weight:600; font-size:0.95rem; cursor:pointer; transition:all 0.2s ease; box-shadow:0 2px 8px rgba(13, 148, 136, 0.25); display:flex; align-items:center; gap:0.4rem; }
  button[type="submit"]:hover { opacity:0.95; transform:translateY(-1px); box-shadow:0 4px 12px rgba(13, 148, 136, 0.35); }

  /* A2UI Component Styles */
  .a2card { border:1px solid var(--border); border-radius:16px; padding:1.2rem; background:#ffffff; box-shadow:0 4px 14px rgba(0,0,0,0.04); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:0.6rem; }
  .a2col { display:flex; flex-direction:column; gap:0.5rem; }
  .a2row { display:flex; flex-direction:row; gap:0.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.5; color:var(--text-primary); }
  .a2text.a2-h1 { font-size:1.5rem; font-weight:700; color:var(--accent-dark); }
  .a2text.a2-h2 { font-size:1.25rem; font-weight:700; color:var(--accent-dark); }
  .a2text.a2-h3 { font-size:1.1rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; }
  .a2text.a2-caption { font-size:0.85rem; color:var(--text-muted); }
  .a2divider { border:none; border-top:1px solid var(--border); margin:0.5rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:12px; display:block; box-shadow:0 2px 8px rgba(0,0,0,0.08); }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <span class="logo">🥑</span>
    <div class="title-group">
      <span class="title">Smart Pantry</span>
      <span class="subtitle">AI Kitchen & Culinary Assistant</span>
    </div>
  </div>
  <div class="status-badge">
    <span class="status-dot"></span>
    <span>Agent Active</span>
  </div>
</header>

<div id="log"></div>

<div class="footer-container">
  <form id="form">
    <div class="prompt-chips">
      <button type="button" class="chip" onclick="sendPrompt('What\'s in my pantry?')">🥗 What's in my pantry?</button>
      <button type="button" class="chip" onclick="sendPrompt('Search recipes for Chicken Curry')">🍲 Find Chicken Curry recipe</button>
      <button type="button" class="chip" onclick="sendPrompt('Generate an image of avocado toast')">🥑 Generate image of avocado toast</button>
    </div>
    <div class="input-container">
      <input id="input" placeholder="Ask something about recipes or your pantry…" autocomplete="off" autofocus>
      <button type="submit">
        <span>Send</span>
        <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
      </button>
    </div>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function sendPrompt(text) {
  input.value = text;
  form.dispatchEvent(new Event("submit", { cancelable: true }));
}

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function bubble(who) {
  const m = el("div", "msg " + who);
  const avatar = el("div", "avatar " + who, who === "user" ? "👤" : "🥑");
  const wrapper = el("div", "msg-content");
  const senderName = el("div", "sender-name", who === "user" ? "You" : "Smart Pantry AI");
  const b = el("div", "bubble");
  
  wrapper.appendChild(senderName);
  wrapper.appendChild(b);
  m.appendChild(avatar);
  m.appendChild(wrapper);
  
  log.appendChild(m);
  log.scrollTop = log.scrollHeight;
  return b;
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
